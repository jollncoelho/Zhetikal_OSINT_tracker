    <script>
      (function () {
        try {
          var node = document.getElementById('zhetikal-theme-data');
          var palettes = JSON.parse(node ? node.textContent || '[]' : '[]');
          if (!palettes.length) return;

          var stored = null;
          try {
            stored = localStorage.getItem('zhetikal-theme');
          } catch (e) {
            /* stockage indisponible : le thème par défaut s'appliquera */
          }

          var theme = null;
          for (var i = 0; i < palettes.length; i++) {
            if (palettes[i].id === stored) {
              theme = palettes[i];
              break;
            }
          }
          if (!theme) theme = palettes[0];

          var root = document.documentElement;
          for (var j = 0; j < theme.tokens.length; j++) {
            root.style.setProperty(theme.tokens[j][0], theme.tokens[j][1]);
          }
          root.style.colorScheme = theme.scheme;
          root.style.backgroundColor = theme.bg;
          root.setAttribute('data-theme', theme.id);
        } catch (e) {
          /* en cas d'échec, ThemeProvider appliquera le thème au montage */
        }
      })();
    </script>
